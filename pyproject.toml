[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weellm"
version = "0.1.0"
description = "Layer-streaming inference for large diffusion models — Under 4 GB VRAM, no quantization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["diffusion", "image-generation", "low-vram", "streaming", "flux", "sdxl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1.0",
    "torchvision",
    "diffusers>=0.37.0",
    "transformers>=4.50.0",
    "accelerate>=0.30.0",
    "safetensors>=0.4.0",
    "Pillow>=10.0.0",
    "tqdm>=4.65.0",
    "psutil>=5.9.0",
    "numpy>=1.24.0",
    "huggingface_hub>=0.20.0",
]

[project.optional-dependencies]
# xformers improves memory efficiency on older GPUs (pre-Ampere).
# Install manually: pip install xformers
# Not auto-installed because it requires a matching CUDA + torch version.
xformers = ["xformers"]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]

[project.scripts]
weellm = "main:main"

[project.urls]
Homepage = "https://github.com/Jit-Roy/weellm"
Repository = "https://github.com/Jit-Roy/weellm"
"Bug Tracker" = "https://github.com/Jit-Roy/weellm/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["weellm*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
